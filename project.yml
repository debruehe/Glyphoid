name: Glyphoid
options:
  bundleIdPrefix: com.glyphoid
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Glyphoid:
    type: application
    platform: macOS
    sources:
      - path: Glyphoid
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Glyphoid/Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.glyphoid.app
      CODE_SIGN_ENTITLEMENTS: Glyphoid/Glyphoid.entitlements
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0
    entitlements:
      path: Glyphoid/Glyphoid.entitlements

  GlyphoidTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GlyphoidTests
    resources:
      - path: Glyphoid/Resources
    dependencies:
      - target: Glyphoid
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.glyphoid.tests
      GENERATE_INFOPLIST_FILE: YES
